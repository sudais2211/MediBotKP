version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medibot-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - SIMULATION_TICK_HZ=20.0
      - DATABASE_URL=sqlite:///./medibot.db
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medibot-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
